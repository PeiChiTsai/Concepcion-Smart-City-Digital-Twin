<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concepcion Digital Twin Demo</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #viewer { width: 100%; height: 100%; }
    
    /* 滑鼠懸停時的小提示框 */
    #feature-hover {
      position: absolute;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none; /* 讓滑鼠點擊可以穿透它 */
      font-size: 14px;
      z-index: 10;
    }

    /* 點擊後顯示的屬性面板 */
    #feature-popup {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(20, 20, 20, 0.9);
      color: white;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      max-width: 300px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 10;
      font-family: sans-serif;
    }
    #feature-popup h2 { margin: 0 0 8px 0; font-size: 18px; }
    #feature-popup p { margin: 0 0 12px 0; font-size: 12px; color: #aaa; }
    #feature-popup table { width: 100%; text-align: left; border-collapse: collapse; font-size: 14px; }
    #feature-popup th, #feature-popup td { padding: 4px; border-bottom: 1px solid #444; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  
  <!-- 這兩個元素用來顯示 3D 建築的資訊 -->
  <div id="feature-hover" hidden></div>
  <div id="feature-popup" hidden></div>

  <script type="module" src="/src/main.tsx"></script> 
</body>
</html>
