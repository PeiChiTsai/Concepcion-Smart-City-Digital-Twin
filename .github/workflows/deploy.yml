name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04   # 🔥 固定版本，避免 ubuntu-latest 跳到 26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24     # 🔥 GitHub Actions 現在要求 Node.js 24
          cache: npm

      - run: npm ci
      - name: Verify backend URL
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
        run: |
          if [ -z "$VITE_BACKEND_URL" ]; then
            echo "::error::Set the VITE_BACKEND_URL Actions variable to the deployed backend URL."
            exit 1
          fi
      - run: npm run build
        env:
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-22.04   # 🔥 同樣固定版本
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
